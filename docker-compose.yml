services:
  # Node.js service (use with: docker compose up nextjs-standalone --build)
  kanwoo-frontend:
    image: "cr.yandex/$CR_REGISTRY/$CR_REPOSITORY:kanwoo-backend-$IMAGE_TAG"
    container_name: kanwoo-frontend
    environment:
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "3000:3000"
    restart: unless-stopped